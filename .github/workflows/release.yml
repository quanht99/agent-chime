name: release

# Push a tag such as v0.2.0 to build the files for every system and publish
# them as a GitHub release. The version in the files comes from the tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum
      - run: bash go/scripts/package.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-linux
          path: go/dist/AgentChime-*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: bash scripts/package-mac.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/AgentChime-*-macos.zip
          if-no-files-found: error

  publish:
    needs: [windows-linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Checksums
        working-directory: files
        run: sha256sum AgentChime-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" files/*
          --repo "$GITHUB_REPOSITORY"
          --title "AgentChime ${GITHUB_REF_NAME#v}"
          --generate-notes
