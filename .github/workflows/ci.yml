name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-linux:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go vet -tags updatetest ./...
      - run: go test -tags updatetest ./internal/update/ ./scripts/...
      - run: bash scripts/e2e-linux.sh
      - run: bash scripts/e2e-update-linux.sh
      - name: Cross builds
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -o /dev/null ./cmd/agentchime
          done
          for a in amd64 arm64; do
            CGO_ENABLED=0 GOOS=windows GOARCH=$a go build -tags production -o /dev/null ./cmd/agentchime-settings
          done

  go-windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: 0
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go vet -tags updatetest ./...
      - run: go test -tags updatetest ./internal/update/ ./scripts/...
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/e2e-update-windows.ps1

  settings-window-linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev
      - run: CGO_ENABLED=1 go vet -tags production ./cmd/agentchime-settings
      - run: CGO_ENABLED=1 go build -tags production -o /dev/null ./cmd/agentchime-settings
      - run: SMOKE_OUT_DIR=$RUNNER_TEMP/smoke bash scripts/docker-gui-smoke.sh amd64
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-smoke
          path: ${{ runner.temp }}/smoke

  windows-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go/go.sum
      - run: OUT=$RUNNER_TEMP/win bash go/scripts/package-windows.sh "0.0.0-ci.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ${{ runner.temp }}/win/AgentChime-*-windows-*.zip
          if-no-files-found: error

  swift-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: bash scripts/test.sh
